<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepometer Daily Target Planner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .planner-card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #4CAF50;
        }

        button.add-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }

        button.add-btn:hover {
            background-color: #45a049;
        }

        ul {
            list-style: none;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            transition: all 0.2s;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-text {
            font-size: 15px;
            color: #333;
            word-break: break-word;
            line-height: 1.4;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: #ffebee;
        }
    </style>
</head>
<body>

    <div class="planner-card">
        <h2>🎯 Prepometer Targets</h2>
        <p class="subtitle">31st July - 13th August Target Schedule</p>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Koi naya extra task add karein..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTaskFromInput()">Add Task</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        // Image se extracted saare daily targets:
        const initialTargets = [
            // 31st July
            "31 July | English: Foreign Words + Active & Passive Voice Practice",
            "31 July | GS: Indian Climate",
            "31 July | Buddha Revision: March Smiling Buddha",
            "31 July | Revision: Interior of the Earth + Earthquake + Volcanoes + Voice",
            
            // 1st Aug
            "1 Aug | English: Homonyms + Previous Year Error Practice",
            "1 Aug | GS: Crops",
            "1 Aug | Buddha Revision: April Smiling Buddha",
            "1 Aug | Revision: Rocks + Geomorphic Processes + Noun",

            // 3rd Aug
            "3 Aug | English: Idioms & Phrases + S1-S2 + Passage",
            "3 Aug | GS: Vegetation of India",
            "3 Aug | Buddha Revision: May Smiling Buddha",
            "3 Aug | Revision: Landforms + Pronoun",

            // 4th Aug
            "4 Aug | English: Parts of Speech + PQRS + Vocab",
            "4 Aug | GS: Köppen's Climate Classification",
            
            // 5th Aug
            "5 Aug | English: Grammar Based Fill-Up + Phrasal Verb",
            "5 Aug | GS: Units & Measurements",
            "5 Aug | Buddha Revision: June Smiling Buddha",
            "5 Aug | Revision: Preamble + FR + DPSP + FDS + Verb + SVA",

            // 6th Aug
            "6 Aug | English: Cloze Test + Vocab + S1-S6",
            "6 Aug | GS: Force, Work, Energy & Power",

            // 7th Aug
            "7 Aug | English: Idioms & Phrases + Passage Practice",
            "7 Aug | GS: Optics",
            "7 Aug | Buddha Revision: April Smiling Buddha (Revision)",
            "7 Aug | Revision: President, VP, PM, CM, Governor + Adverb",

            // 8th Aug
            "8 Aug | English: Foreign Words + Error Practice",
            "8 Aug | GS: Sound",

            // 10th Aug
            "10 Aug | English: Homonyms + S1-S2 + Vocab",
            "10 Aug | GS: Current Electricity",
            "10 Aug | Buddha Revision: May Smiling Buddha (Revision)",
            "10 Aug | Revision: Parliament + Adjective",

            // 11th Aug
            "11 Aug | English: Preposition + Determiner Based Fill-Up + S1-S6",
            "11 Aug | GS: Magnetism",

            // 12th Aug
            "12 Aug | English: Cloze Test + Idioms & Phrases + PQRS",
            "12 Aug | GS: Motion",
            "12 Aug | Buddha Revision: June Smiling Buddha (Revision)",
            "12 Aug | Revision: Supreme Court + High Court + Question Tag",

            // 13th Aug
            "13 Aug | English: Parts of Speech + Foreign Words + Vocab",
            "13 Aug | GS: Gravitation",
            "13 Aug | Buddha Revision: June Smiling Buddha (Revision)",
            "13 Aug | Revision: Constitutional & Non-Constitutional Bodies + Conjunction"
        ];

        // Unique key for local storage
        const STORAGE_KEY = "prepometer_targets_v1";

        // LocalStorage se status fetch karein ya naye targets load karein
        let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY));

        if (!tasks || tasks.length === 0) {
            tasks = initialTargets.map(targetText => ({
                text: targetText,
                completed: false
            }));
            saveToLocalStorage();
        }

        renderTasks();

        function renderTasks() {
            const list = document.getElementById("taskList");
            list.innerHTML = "";

            tasks.forEach((task, index) => {
                const li = document.createElement("li");
                if (task.completed) {
                    li.classList.add("completed");
                }

                const taskInfo = document.createElement("div");
                taskInfo.className = "task-info";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.onchange = () => toggleTask(index);

                const span = document.createElement("span");
                span.className = "task-text";
                span.textContent = task.text;

                taskInfo.appendChild(checkbox);
                taskInfo.appendChild(span);

                const deleteBtn = document.createElement("button");
                deleteBtn.className = "delete-btn";
                deleteBtn.innerHTML = "&#10005;";
                deleteBtn.onclick = () => deleteTask(index);

                li.appendChild(taskInfo);
                li.appendChild(deleteBtn);
                list.appendChild(li);
            });

            saveToLocalStorage();
        }

        function addTaskFromInput() {
            const input = document.getElementById("taskInput");
            const text = input.value.trim();

            if (text !== "") {
                tasks.unshift({ text: text, completed: false });
                input.value = "";
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                addTaskFromInput();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }
    </script>

</body>
</html>
